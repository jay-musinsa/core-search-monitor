name: Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:23.3
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: test_db
          CLICKHOUSE_USER: test_user
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget curl

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Wait for services
      run: |
        echo "Waiting for ClickHouse..."
        timeout 60 bash -c 'until curl -s http://localhost:8123/ping; do sleep 1; done'
        echo "Waiting for Redis..."
        timeout 60 bash -c 'until redis-cli -h localhost ping; do sleep 1; done'

    - name: Set up test environment
      run: |
        export PYTHONPATH=$PWD
        export ENVIRONMENT=test
        export CLICKHOUSE_HOST=localhost
        export CLICKHOUSE_PORT=8123
        export CLICKHOUSE_USER=test_user
        export CLICKHOUSE_PASSWORD=
        export REDIS_URL=redis://localhost:6379/0
        export OPENAI_API_KEY=test_key_for_ci

    - name: Initialize test database
      run: |
        export PYTHONPATH=$PWD
        export CLICKHOUSE_HOST=localhost
        export CLICKHOUSE_PORT=8123
        python database/init_db.py

    - name: Run unit tests
      run: |
        export PYTHONPATH=$PWD
        pytest tests/test_*.py -v --tb=short

    - name: Run integration tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        ENVIRONMENT: test
        CLICKHOUSE_HOST: localhost
        CLICKHOUSE_PORT: 8123
        CLICKHOUSE_USER: test_user
        CLICKHOUSE_PASSWORD: ""
        REDIS_URL: redis://localhost:6379/0
        OPENAI_API_KEY: test_key_for_ci
      run: |
        pytest tests/integration/ -v --tb=short --maxfail=5

    - name: Run API tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        ENVIRONMENT: test
        CLICKHOUSE_HOST: localhost
        CLICKHOUSE_PORT: 8123
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/integration/test_api_endpoints.py -v

    - name: Generate test coverage
      env:
        PYTHONPATH: ${{ github.workspace }}
        ENVIRONMENT: test
        CLICKHOUSE_HOST: localhost
        CLICKHOUSE_PORT: 8123
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/ --cov=app --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: integration
        name: codecov-umbrella

    - name: Archive test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          htmlcov/
          pytest.xml
          coverage.xml

    - name: Archive logs on failure
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: test-logs
        path: |
          logs/
          *.log

  docker-integration-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build test environment
      run: |
        docker-compose -f docker-compose.test.yml build

    - name: Run Docker integration tests
      run: |
        docker-compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from app-test

    - name: Archive Docker logs
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: docker-logs
        path: |
          docker-logs/

    - name: Cleanup Docker environment
      if: always()
      run: |
        docker-compose -f docker-compose.test.yml down -v --remove-orphans

  performance-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:23.3
        ports:
          - 8123:8123
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run performance tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        ENVIRONMENT: test
        CLICKHOUSE_HOST: localhost
        CLICKHOUSE_PORT: 8123
        REDIS_URL: redis://localhost:6379/0
      run: |
        pytest tests/integration/ -m "performance" -v --benchmark-json=benchmark.json

    - name: Archive performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: benchmark.json

  security-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run security scan with bandit
      run: |
        bandit -r app/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Run dependency security check
      run: |
        safety check --json --output safety-report.json
      continue-on-error: true

    - name: Archive security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json