version: '3.8'

services:
  # ClickHouse 테스트 데이터베이스
  clickhouse-test:
    image: clickhouse/clickhouse-server:23.3
    container_name: clickhouse-test
    ports:
      - "8124:8123"
      - "9001:9000"
    environment:
      CLICKHOUSE_DB: test_db
      CLICKHOUSE_USER: test_user
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./tests/integration/fixtures/test_data.sql:/docker-entrypoint-initdb.d/02_test_data.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # Redis 테스트 인스턴스
  redis-test:
    image: redis:7-alpine
    container_name: redis-test
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - test-network

  # MinIO 테스트 스토리지 (S3 호환)
  minio-test:
    image: minio/minio:latest
    container_name: minio-test
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - test-network

  # Kafka 테스트 인스턴스
  zookeeper-test:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-test
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - test-network

  kafka-test:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-test
    depends_on:
      - zookeeper-test
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-test:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-topics", "--list", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - test-network

  # FastAPI 테스트 애플리케이션
  app-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: app-test
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=test
      - CLICKHOUSE_HOST=clickhouse-test
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=test_user
      - CLICKHOUSE_PASSWORD=
      - REDIS_URL=redis://redis-test:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka-test:9092
      - AWS_ACCESS_KEY_ID=testuser
      - AWS_SECRET_ACCESS_KEY=testpassword
      - AWS_S3_BUCKET=test-bucket
      - AWS_ENDPOINT_URL=http://minio-test:9000
      - PYTHONPATH=/app
    depends_on:
      clickhouse-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      kafka-test:
        condition: service_healthy
    volumes:
      - .:/app
      - ./tests:/app/tests
    command: >
      sh -c "
        echo 'Waiting for services to be ready...' &&
        sleep 10 &&
        python -m pytest tests/integration/ -v --tb=short
      "
    networks:
      - test-network

  # Selenium Grid Hub (웹 테스트용)
  selenium-hub:
    image: selenium/hub:4.15.0
    container_name: selenium-hub-test
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      - GRID_MAX_SESSION=5
    networks:
      - test-network

  # Chrome WebDriver
  selenium-chrome:
    image: selenium/node-chrome:4.15.0
    container_name: selenium-chrome-test
    depends_on:
      - selenium-hub
    environment:
      - HUB_HOST=selenium-hub
      - NODE_MAX_INSTANCES=2
      - NODE_MAX_SESSION=2
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - test-network

volumes:
  minio-test-data:

networks:
  test-network:
    driver: bridge